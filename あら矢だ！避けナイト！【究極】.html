<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>あら矢だ！避けナイト！【究極】</title>
    <style>
        body { background-color: #1a1a1a; color: white; text-align: center; font-family: "Meiryo", sans-serif; overflow: hidden; margin: 0; }
        #gameContainer { position: relative; width: 800px; margin: 10px auto; }
        canvas { background-color: #222; border: 4px solid #f0ad4e; display: block; border-radius: 5px; }
        .ui { font-size: 20px; margin-bottom: 5px; font-weight: bold; background: #333; padding: 10px; }
        .hl { color: #ffeb3b; }
        #message { position: absolute; top: 20px; width: 100%; text-align: center; color: #00ffcc; font-size: 2em; font-weight: bold; pointer-events: none; text-shadow: 2px 2px 4px #000; }
        #ranking { position: absolute; top: 100px; width: 100%; text-align: center; display: none; background: rgba(0,0,0,0.8); padding: 20px 0; }
    </style>
</head>
<body>

    <div class="ui">
        STAGE: <span id="stageNum" style="color:#00ffcc;">1</span> | 
        HP: <span id="hpDisplay" style="color: #ff4444;">200</span> | 
        SCORE: <span id="scoreDisplay">0</span><br>
        <span class="hl">A</span>: <span id="healDisplay">1</span> | 
        <span class="hl">D</span>: <span id="clearDisplay">3</span>
    </div>
    
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="message"></div>
        <div id="ranking">
            <h2 style="color: gold;">🏆 RANKING 🏆</h2>
            <div id="rankingList"></div>
            <p>F5キーでリトライ</p>
        </div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const hpDisplay = document.getElementById("hpDisplay");
    const scoreDisplay = document.getElementById("scoreDisplay");
    const stageNumDisplay = document.getElementById("stageNum");
    const healDisplay = document.getElementById("healDisplay");
    const clearDisplay = document.getElementById("clearDisplay");
    const messageDisplay = document.getElementById("message");
    const rankingDiv = document.getElementById("ranking");

    let player = { x: 400, y: 450, size: 10, hp: 200, speed: 6 };
    const ARENA_CENTER = { x: 400, y: 500 };
    const ARENA_RADIUS = 400;

    let enemies = [
        { x: 100, y: 50, tx: 100, ty: 50, lastShot: 0, lastMine: 0 },
        { x: 400, y: 80, tx: 400, ty: 80, lastShot: 0, lastMine: 0 },
        { x: 700, y: 50, tx: 700, ty: 50, lastShot: 0, lastMine: 0 }
    ];

    let arrows = [];
    let bombs = [];
    let particles = [];
    let skills = { heal: 1, clear: 3 };
    let keys = {};
    let gameOver = false;
    let startTime = Date.now();
    let currentScore = 0;

    let gameClock = 0;
    let stageState = "STAGE1";

    window.addEventListener("keydown", (e) => {
        keys[e.code] = true;
        if (!gameOver) {
            if (e.code === "KeyA" && skills.heal > 0) {
                player.hp = 200; skills.heal--;
                showMessage("あら矢だ！ 命びろい！");
                createHealEffect(player.x + player.size/2, player.y + player.size/2);
            }
            if (e.code === "KeyD" && skills.clear > 0) {
                arrows = []; bombs = []; skills.clear--;
                showMessage("避けナイト！ 嵐の守護！");
                createClearEffect();
            }
        }
    });
    window.addEventListener("keyup", (e) => keys[e.code] = false);

    function showMessage(txt) {
        messageDisplay.innerText = txt;
        setTimeout(() => { if(messageDisplay.innerText === txt) messageDisplay.innerText = ""; }, 1800);
    }

    function createHealEffect(x, y) {
        for (let i = 0; i < 50; i++) {
            particles.push({ x, y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, size: Math.random()*5+2, color: '#ffff00', alpha: 1, decay: 0.02 });
        }
    }

    function createClearEffect() {
        for (let i = 0; i < 80; i++) {
            particles.push({ x: Math.random()*canvas.width, y: 500, vx: (Math.random()-0.5)*4, vy: -(Math.random()*8+4), size: Math.random()*4+2, color: '#00ff44', alpha: 0.8, decay: 0.01 });
        }
    }

    function update() {
        if (gameOver) return;

        let now = Date.now();
        gameClock = (now - startTime) / 1000;
        currentScore = Math.floor(gameClock * 5);
        scoreDisplay.innerText = currentScore;

        let cycleTime = gameClock % 74;
        if (cycleTime < 15) {
            if(stageState !== "STAGE1") { stageState = "STAGE1"; showMessage("Stage 1: 矢の雨"); }
        } else if (cycleTime < 18) {
            if(stageState !== "WAIT1") { stageState = "WAIT1"; showMessage("Break..."); }
        } else if (cycleTime < 33) {
            if(stageState !== "STAGE2") { stageState = "STAGE2"; showMessage("Stage 2: 爆ぜる矢"); }
        } else if (cycleTime < 37) {
            if(stageState !== "WAIT2") { stageState = "WAIT2"; showMessage("Break..."); }
        } else if (cycleTime < 52) {
            if(stageState !== "STAGE3") { stageState = "STAGE3"; showMessage("Stage 3: 爆走地雷"); }
        } else if (cycleTime < 56) {
            if(stageState !== "WAIT3") { stageState = "WAIT3"; showMessage("Break..."); }
        } else if (cycleTime < 71) {
            if(stageState !== "STAGE4") { stageState = "STAGE4"; showMessage("Stage 4: 誘導追尾矢"); }
        } else {
            if(stageState !== "WAIT4") { stageState = "WAIT4"; showMessage("Break..."); }
        }

        let stNum = "1";
        if (stageState.includes("2")) stNum = "2";
        else if (stageState.includes("3")) stNum = "3";
        else if (stageState.includes("4")) stNum = "4";
        stageNumDisplay.innerText = stNum;

        let nextX = player.x;
        let nextY = player.y;
        if (keys["ArrowUp"]) nextY -= player.speed;
        if (keys["ArrowDown"]) nextY += player.speed;
        if (keys["ArrowLeft"]) nextX -= player.speed;
        if (keys["ArrowRight"]) nextX += player.speed;

        let dist = Math.sqrt(Math.pow(nextX + player.size/2 - ARENA_CENTER.x, 2) + Math.pow(nextY + player.size/2 - ARENA_CENTER.y, 2));
        if (dist < ARENA_RADIUS - 10 && nextY < 480) {
            player.x = nextX;
            player.y = nextY;
        }

        enemies.forEach(en => {
            let moveSpeed = (stageState === "STAGE3") ? 0.04 : 0.02;
            if (Math.abs(en.x - en.tx) < 10 && Math.abs(en.y - en.ty) < 10) {
                en.tx = Math.random() * 760 + 20;
                en.ty = Math.random() * (stageState === "STAGE3" ? 200 : 100) + 20;
            }
            en.x += (en.tx - en.x) * moveSpeed;
            en.y += (en.ty - en.y) * moveSpeed;

            if (stageState === "STAGE1" && now - en.lastShot > 1200) {
                for(let i=0; i<9; i++) {
                    arrows.push({ x: en.x, y: en.y, vx: (Math.random()-0.5)*2, vy: 1 + Math.random(), type: 'normal' });
                }
                en.lastShot = now;
            }

            if (stageState === "STAGE2" && now - en.lastShot > 2900) {
                let angle = Math.random() * Math.PI + Math.PI;
                let r = Math.random() * (ARENA_RADIUS - 50);
                bombs.push({
                    x: en.x, y: en.y,
                    targetX: ARENA_CENTER.x + Math.cos(angle) * r,
                    targetY: ARENA_CENTER.y + Math.sin(angle) * r,
                    progress: 0, blinkCount: 0, lastBlink: 0, state: 'flying'
                });
                en.lastShot = now;
            }

            if (stageState === "STAGE3" && now - en.lastMine > 1200) {
                bombs.push({
                    x: en.x, y: en.y, targetX: en.x, targetY: en.y,
                    progress: 0, blinkCount: 0, lastBlink: now, state: 'blinking'
                });
                en.lastMine = now;
            }

            if (stageState === "STAGE4" && now - en.lastShot > 1600) {
                arrows.push({
                    x: en.x, y: en.y, vx: (Math.random()-0.5)*2, vy: 2,
                    type: 'homing', homingTimer: 160
                });
                en.lastShot = now;
            }
        });

        for (let i = bombs.length - 1; i >= 0; i--) {
            let b = bombs[i];
            if (b.state === 'flying') {
                b.x += (b.targetX - b.x) * 0.05;
                b.y += (b.targetY - b.y) * 0.05;
                if (Math.abs(b.x - b.targetX) < 2) b.state = 'blinking';
            } else if (b.state === 'blinking') {
                if (now - b.lastBlink > 350) {
                    b.blinkCount++;
                    b.lastBlink = now;
                    if (b.blinkCount >= 6) {
                        for (let j = 0; j < 24; j++) {
                            let ang = (Math.PI * 2 / 24) * j;
                            arrows.push({ x: b.x, y: b.y, vx: Math.cos(ang) * 1.6, vy: Math.sin(ang) * 1.6, type: 'normal' });
                        }
                        bombs.splice(i, 1);
                    }
                }
            }
        }

        for (let i = arrows.length - 1; i >= 0; i--) {
            let a = arrows[i];

            if (a.type === 'homing' && a.homingTimer > 0) {
                a.homingTimer--;
                let targetAngle = Math.atan2((player.y + player.size/2) - a.y, (player.x + player.size/2) - a.x);
                a.vx += Math.cos(targetAngle) * 0.15;
                a.vy += Math.sin(targetAngle) * 0.15;
                let len = Math.hypot(a.vx, a.vy);
                a.vx = (a.vx / len) * 2.8;
                a.vy = (a.vy / len) * 2.8;
            }

            a.x += a.vx; a.y += a.vy;

            if (a.x < player.x + player.size && a.x + 4 > player.x && a.y < player.y + player.size && a.y + 10 > player.y) {
                player.hp -= 50; arrows.splice(i, 1);
                if (player.hp <= 0) handleGameOver();
                continue;
            }
            if (a.y > 550 || a.y < -50 || a.x < -50 || a.x > 850) arrows.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
            if (p.alpha <= 0) particles.splice(i, 1);
        }

        hpDisplay.innerText = player.hp;
        healDisplay.innerText = skills.heal;
        clearDisplay.innerText = skills.clear;
    }

    function handleGameOver() {
        gameOver = true;
        player.hp = 0;
        hpDisplay.innerText = 0;
        
        let scores = JSON.parse(localStorage.getItem('bow_ranking') || "[]");
        scores.push(currentScore);
        scores.sort((a, b) => b - a);
        scores = scores.slice(0, 5);
        localStorage.setItem('bow_ranking', JSON.stringify(scores));

        let listHtml = scores.map((s, i) => `<p>${i+1}位: ${s} pts</p>`).join("");
        document.getElementById("rankingList").innerHTML = listHtml;
        rankingDiv.style.display = "block";
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.arc(ARENA_CENTER.x, ARENA_CENTER.y, ARENA_RADIUS, Math.PI, 0);
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.stroke();

        ctx.fillStyle = "#ff5555";
        enemies.forEach(en => {
            ctx.beginPath(); ctx.arc(en.x, en.y, 18, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "white"; ctx.stroke();
        });

        bombs.forEach(b => {
            ctx.fillStyle = (b.state === 'blinking' && Math.floor(Date.now()/150) % 2 === 0) ? "white" : "red";
            ctx.beginPath(); ctx.arc(b.x, b.y, 10, 0, Math.PI*2); ctx.fill();
        });

        arrows.forEach(a => {
            ctx.save(); ctx.translate(a.x, a.y);
            ctx.rotate(Math.atan2(a.vy, a.vx) - Math.PI/2);
            ctx.fillStyle = (a.type === 'homing') ? "#ff00ff" : "#ffff00";
            ctx.fillRect(-2, 0, 4, 12); ctx.restore();
        });

        particles.forEach(p => {
            ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1;

        ctx.fillStyle = "#3399ff";
        ctx.shadowBlur = 10; ctx.shadowColor = "#3399ff";
        ctx.fillRect(player.x, player.y, player.size, player.size);
        ctx.shadowBlur = 0;

        requestAnimationFrame(() => { update(); draw(); });
    }

    draw();
</script>
</body>
</html>
