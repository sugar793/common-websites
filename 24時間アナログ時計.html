<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24時間アナログ時計</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        .clock-container {
            text-align: center;
        }

        .clock {
            position: relative;
            width: 360px;
            height: 360px;
            border: 12px solid #2c3e50;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        /* 中心点 */
        .center-nut {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #2c3e50;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* 針の共通設定 */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px 4px 0 0;
            z-index: 5;
        }

        /* 時針（24時間で1周 / 1時間で15度動く） */
        .hour-hand {
            width: 6px;
            height: 90px;
            background-color: #2c3e50;
            margin-left: -3px;
        }

        /* 分針（1時間で1周 / 通常の時計と同じ） */
        .minute-hand {
            width: 4px;
            height: 130px;
            background-color: #7f8c8d;
            margin-left: -2px;
        }

        /* 秒針（1分で1周 / スムーズに動く仕様） */
        .second-hand {
            width: 2px;
            height: 145px;
            background-color: #e74c3c;
            margin-left: -1px;
        }

        /* 目盛り */
        .tick {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        .tick::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 50%;
            width: 2px;
            height: 8px;
            background-color: #bdc3c7;
            transform: translateX(-50%);
        }
        /* 6時間ごと（6, 12, 18, 24時）の目盛りを強調 */
        .tick.major::before {
            width: 4px;
            height: 14px;
            background-color: #2c3e50;
        }

        /* 文字盤の数字 */
        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            text-align: center;
            padding-top: 24px;
            box-sizing: border-box;
            font-size: 14px;
            font-weight: bold;
            color: #34495e;
        }
        .number span {
            display: inline-block;
        }
        
        /* デジタル時計表示（答え合わせ用） */
        .digital-time {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            background: white;
            padding: 6px 18px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="clock-container">
    <div class="clock">
        <div class="center-nut"></div>
        <div class="hand hour-hand"></div>
        <div class="hand minute-hand"></div>
        <div class="hand second-hand"></div>
    </div>
    <div class="digital-time" id="digital">00:00:00</div>
</div>

<script>
    const clock = document.querySelector('.clock');
    const hourHand = document.querySelector('.hour-hand');
    const minuteHand = document.querySelector('.minute-hand');
    const secondHand = document.querySelector('.second-hand');
    const digitalDisplay = document.getElementById('digital');

    // JavaScriptで24時間分の数字と目盛りを自動生成
    for (let i = 1; i <= 24; i++) {
        const angle = i * 15; // 360度 ÷ 24時間 ＝ 1時間あたり15度

        // 目盛りの生成
        const tick = document.createElement('div');
        tick.className = 'tick';
        if (i % 6 === 0) {
            tick.classList.add('major'); 
        }
        tick.style.transform = `rotate(${angle}deg)`;
        clock.appendChild(tick);

        // 数字の生成
        const number = document.createElement('div');
        number.className = 'number';
        number.innerHTML = `<span>${i}</span>`;
        number.style.transform = `rotate(${angle}deg)`;
        
        // 文字自体が傾かないように内側のspanを逆回転させる
        number.querySelector('span').style.transform = `rotate(${-angle}deg)`;
        clock.appendChild(number);
    }

    // 時計の針をリアルタイムで動かす関数
    function updateClock() {
        const now = new Date();
        const hours = now.getHours();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        const ms = now.getMilliseconds();

        // 1. 時針の角度（1時間で15度進む ＋ 分と秒で微調整）
        const hourAngle = (hours * 15) + (minutes * (15 / 60)) + (seconds * (15 / 3600));
        
        // 2. 分針の角度（1分で6度進む ＋ 秒で微調整）
        const minuteAngle = (minutes * 6) + (seconds * (6 / 60));
        
        // 3. 秒針の角度（1秒で6度進む ＋ ミリ秒で滑らかに動かす）
        const secondAngle = (seconds * 6) + (ms * (6 / 1000));

        // 各針のCSSを更新して回転させる
        hourHand.style.transform = `rotate(${hourAngle}deg)`;
        minuteHand.style.transform = `rotate(${minuteAngle}deg)`;
        secondHand.style.transform = `rotate(${secondAngle}deg)`;

        // 下部のデジタル時計も更新
        const hStr = String(hours).padStart(2, '0');
        const mStr = String(minutes).padStart(2, '0');
        const sStr = String(seconds).padStart(2, '0');
        digitalDisplay.textContent = `${hStr}:${mStr}:${sStr}`;

        // 画面の更新に合わせてループ（滑らかなアニメーション用）
        requestAnimationFrame(updateClock);
    }

    // 時計の実行開始
    requestAnimationFrame(updateClock);
</script>

</body>
</html>
