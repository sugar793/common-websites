<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛のディスタンス 〜2mの籍入りチャレンジ〜</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0fdf4;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 24px;
        }
        p {
            color: #7f8c8d;
            margin: 0 0 15px 0;
            font-size: 14px;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #e8f5e9;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(25, 25, 25, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        #resultTitle {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #resultDesc {
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
            line-height: 1.6;
        }
        .count-badge {
            font-size: 24px;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
            margin-top: 15px;
            display: block;
        }
        button {
            padding: 12px 40px;
            font-size: 20px;
            font-weight: bold;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        button:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>愛のディスタンス 〜2mの籍入りチャレンジ〜</h1>
    <p>操作: 矢印キー or WASD。彼女から2m（ピンクの円）以上離れてはいけないぞ！</p>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="overlay" class="active">
            <div id="resultTitle">愛のディスタンス</div>
            <div id="resultDesc">20秒間、彼女の【2m以内】をキープせよ！</div>
            <button id="startBtn" onclick="resetGame()">試練に挑む</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const resultTitle = document.getElementById('resultTitle');
const resultDesc = document.getElementById('resultDesc');
const startBtn = document.getElementById('startBtn');

// スケール設定: 1メートル = 30ピクセル (2メートル = 60ピクセル)
const METER_TO_PX = 30;
const SAFE_DISTANCE_M = 2; 
const SAFE_DISTANCE_PX = SAFE_DISTANCE_M * METER_TO_PX;

const BASE_SPEED = 4; // プレイヤーの通常速度

// ゲーム状態
let gameActive = false;
let timeLeft = 20.0; 
let flowers = [];
let reincarnationCount = 0; // ★転生回数のカウンター

// キー入力状態
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// プレイヤー（男性型）
const player = {
    x: 415, 
    y: 300,
    radius: 12,
    speed: BASE_SPEED,
    color: '#1e90ff',
    hasBaggage: false 
};

// CPU（女性型）
const cpu = {
    x: 400,
    y: 300,
    radius: 12,
    speed: 1.8,
    color: '#ff6b81', 
    state: 'walk', 
    stateTimer: 0,
    targetX: 400,
    targetY: 300,
    
    update: function() {
        this.stateTimer--;
        
        if (this.stateTimer <= 0) {
            if (this.state === 'walk') {
                this.state = 'idle';
                this.stateTimer = Math.random() * 50 + 30; 
            } else {
                this.state = 'walk';
                this.stateTimer = Math.random() * 100 + 70; 
                this.targetX = Math.random() * (canvas.width - 120) + 60;
                this.targetY = Math.random() * (canvas.height - 120) + 60;
            }
        }

        if (this.state === 'walk') {
            let dx = this.targetX - this.x;
            let dy = this.targetY - this.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist > 5) {
                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
            }
        }
        
        this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
    }
};

function initFlowers() {
    flowers = [];
    const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#eccc68', '#ff6b81'];
    for (let i = 0; i < 60; i++) {
        flowers.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 6 + 4,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }
}

function resetGame() {
    player.x = 415;
    player.y = 300;
    player.speed = BASE_SPEED;
    player.hasBaggage = false;
    cpu.x = 400;
    cpu.y = 300;
    cpu.state = 'idle';
    cpu.stateTimer = 40;
    timeLeft = 20.0;
    initFlowers();
    overlay.classList.remove('active');
    gameActive = true;
}

function endGame(isWin) {
    gameActive = false;
    overlay.classList.add('active');
    if (isWin) {
        reincarnationCount++; // ★成功したら転生回数をカウントアップ
        
        resultTitle.textContent = "神・籍入り！";
        resultTitle.style.color = "#2ed573";
        resultDesc.innerHTML = `素晴らしい！2mの籍入りチャレンジを乗り越えました！<br>あなたは真の愛を証明し、次の生へと歩みを進めます。<br><span class="count-badge">現在の転生回数: ${reincarnationCount} 回</span>`;
        startBtn.textContent = "転生"; // ★ボタンを「転生」に変更
        startBtn.style.backgroundColor = "#2ed573";
        startBtn.style.boxShadow = "0 5px 15px rgba(46, 213, 115, 0.4)";
    } else {
        resultTitle.textContent = "玉砕...";
        resultTitle.style.color = "#ff4757";
        if (timeLeft <= 10.0) {
            resultDesc.innerHTML = `重すぎる荷物（速度3）に耐えかねて、2mの距離を保てませんでした…<br>無念のゲームオーバー！<br><span style="color:#aaa; font-size:14px;">（現在の累計転生回数: ${reincarnationCount} 回）</span>`;
        } else {
            resultDesc.innerHTML = `荷物を持たされる前に、2mの壁に阻まれました…<br>修行が足りません！<br><span style="color:#aaa; font-size:14px;">（現在の累計転生回数: ${reincarnationCount} 回）</span>`;
        }
        startBtn.textContent = "転生する";
        startBtn.style.backgroundColor = "#ff4757";
        startBtn.style.boxShadow = "0 5px 15px rgba(255, 71, 87, 0.4)";
    }
}

function gameLoop() {
    if (gameActive) {
        updateLogic();
    }
    render();
    requestAnimationFrame(gameLoop);
}

function updateLogic() {
    timeLeft -= 1 / 60; 
    if (timeLeft <= 0) {
        timeLeft = 0;
        endGame(true); 
        return;
    }

    // ★ギミック：10秒経過（残り10秒以下）で荷物を持たされ速度が「3」に低下
    if (timeLeft <= 10.0) {
        player.speed = 3; 
        player.hasBaggage = true;
    } else {
        player.speed = BASE_SPEED;
        player.hasBaggage = false;
    }

    // プレイヤーの移動
    if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;

    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

    cpu.update();

    let dx = player.x - cpu.x;
    let dy = player.y - cpu.y;
    let distancePx = Math.sqrt(dx * dx + dy * dy);
    let distanceM = distancePx / METER_TO_PX;

    if (distanceM > SAFE_DISTANCE_M) {
        endGame(false); 
    }
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#e8f5e9";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    flowers.forEach(f => {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
        ctx.fillStyle = f.color;
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size * 0.3, 0, Math.PI * 2);
        ctx.fill();
    });

    // CPUの「2mセーフエリア」円の描画
    ctx.beginPath();
    ctx.arc(cpu.x, cpu.y, SAFE_DISTANCE_PX, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 107, 129, 0.18)'; 
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 107, 129, 0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]); 
    ctx.stroke();
    ctx.setLineDash([]); 

    // CPU（女性型）の描画
    ctx.beginPath();
    ctx.arc(cpu.x, cpu.y, cpu.radius, 0, Math.PI * 2);
    ctx.fillStyle = cpu.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#ff7675';
    ctx.font = '10px Arial';
    ctx.fillText("♀ CPU", cpu.x - 18, cpu.y - 18);

    // プレイヤー（男性型）の描画
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = player.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#0984e3';
    ctx.font = '10px Arial';
    ctx.fillText(player.hasBaggage ? "♂ 荷物(速3)" : "♂ あなた", player.x - 25, player.y - 18);

    // 10秒以下のとき、画面中央上に「荷物持ち発生！」の警告を表示
    if (player.hasBaggage) {
        ctx.fillStyle = 'rgba(235, 77, 75, 0.8)';
        ctx.fillRect(canvas.width / 2 - 120, 20, 240, 35);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("⚠️ 荷物持ち発生！速度[3]に低下！", canvas.width / 2, 43);
        ctx.textAlign = 'left'; 
    }

    // UI
    let dx = player.x - cpu.x;
    let dy = player.y - cpu.y;
    let currentDistM = (Math.sqrt(dx * dx + dy * dy) / METER_TO_PX).toFixed(2);

    ctx.fillStyle = 'rgba(44, 62, 80, 0.8)';
    ctx.fillRect(15, 15, 200, 95); // 回数表示のために少し縦を広げました
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(15, 15, 200, 95);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(`残り時間: ${timeLeft.toFixed(2)} 秒`, 30, 40);
    
    if (currentDistM > 1.4) {
        ctx.fillStyle = '#ff4757'; 
    } else {
        ctx.fillStyle = '#2ed573'; 
    }
    ctx.fillText(`二人の距離: ${currentDistM} m`, 30, 65);

    ctx.fillStyle = '#ffd700';
    ctx.fillText(`現在の転生回数: ${reincarnationCount} 回`, 30, 90);
}

initFlowers();
gameLoop();
</script>

</body>
</html>
