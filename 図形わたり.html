<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Runner - 図形の上を渡れ！</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* 背景は真っ暗 */
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: white;
            user-select: none;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 40px;
            border-radius: 15px;
            border: 2px solid #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            min-width: 320px;
        }
        h1 {
            font-size: 42px;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        p {
            font-size: 16px;
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .score-result {
            font-size: 22px;
            color: #fff;
            margin: 15px 0;
        }
        .highscore-result {
            font-size: 18px;
            color: #00ffff;
            margin-bottom: 25px;
            font-weight: bold;
        }
        button {
            padding: 12px 35px;
            font-size: 20px;
            background-color: #fff;
            color: #000;
            border: none;
            cursor: pointer;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        button:hover {
            background-color: #00ffff;
            box-shadow: 0 0 15px #00ffff;
            transform: scale(1.05);
        }
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            display: none;
            text-shadow: 0 0 8px rgba(255,255,255,0.8);
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="score-display">SCORE: 0</div>
    
    <div id="ui">
        <h1 id="title">SHAPE RUNNER</h1>
        <div id="content">
            <p>マウスカーソルがプレイヤーです。<br>右から流れてくる図形の上だけを通り、真っ暗な穴に落ちないように進め！<br><span style="color: #ff5555; font-size: 14px;">※黒いところに出ても0.2秒間は耐えられます！</span></p>
        </div>
        <button id="start-btn">スタート</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let shapes = [];
        let gameState = 'START'; // START, PLAYING, FALLING, GAMEOVER
        let mouseX = 0, mouseY = 0;
        let fallX = 0, fallY = 0;
        let gameSpeed = 3;
        let score = 0;
        const playerRadius = 10;
        let playerFallScale = 1.0;

        // 【新機能】0.2秒の猶予期間を計測するための変数
        let offShapeStartTime = null; 
        const gracePeriod = 200; // 猶予時間（200ミリ秒 = 0.2秒）

        // ブラウザ保存からハイスコアを読み込み
        let highScore = parseInt(localStorage.getItem('shape_runner_highscore')) || 0;

        // 三角形の当たり判定用
        function sign(p1, p2, p3) {
            return (p1.x - p3.x) * (p2.y - p3.y) - (p2.x - p3.x) * (p1.y - p3.y);
        }
        function isPointInTriangle(pt, v1, v2, v3) {
            let d1 = sign(pt, v1, v2);
            let d2 = sign(pt, v2, v3);
            let d3 = sign(pt, v3, v1);
            let has_neg = (d1 < 0) || (d2 < 0) || (d3 < 0);
            let has_pos = (d1 > 0) || (d2 > 0) || (d3 > 0);
            return !(has_neg && has_pos);
        }

        // 図形クラス
        class Shape {
            constructor(cx, cy, type) {
                this.x = cx;
                this.y = cy;
                this.type = type;
                this.color = `hsl(${Math.random() * 360}, 85%, 60%)`;
                
                if (this.type === 'rect') {
                    this.w = 140 + Math.random() * 100;
                    this.h = 90 + Math.random() * 60;
                } else if (this.type === 'circle') {
                    this.r = 55 + Math.random() * 40;
                } else if (this.type === 'triangle') {
                    this.r = 65 + Math.random() * 40;
                    this.angle = Math.random() * Math.PI;
                    this.updateVertices();
                }
            }

            updateVertices() {
                if (this.type === 'triangle') {
                    this.p1 = { x: this.x + this.r * Math.cos(this.angle), y: this.y + this.r * Math.sin(this.angle) };
                    this.p2 = { x: this.x + this.r * Math.cos(this.angle + 2*Math.PI/3), y: this.y + this.r * Math.sin(this.angle + 2*Math.PI/3) };
                    this.p3 = { x: this.x + this.r * Math.cos(this.angle + 4*Math.PI/3), y: this.y + this.r * Math.sin(this.angle + 4*Math.PI/3) };
                }
            }

            move(dx) {
                this.x -= dx;
                if (this.type === 'triangle') {
                    this.p1.x -= dx;
                    this.p2.x -= dx;
                    this.p3.x -= dx;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                
                ctx.beginPath();
                if (this.type === 'rect') {
                    ctx.fillRect(this.x - this.w/2, this.y - this.h/2, this.w, this.h);
                } else if (this.type === 'circle') {
                    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'triangle') {
                    ctx.moveTo(this.p1.x, this.p1.y);
                    ctx.lineTo(this.p2.x, this.p2.y);
                    ctx.lineTo(this.p3.x, this.p3.y);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
            }

            contains(px, py) {
                if (this.type === 'rect') {
                    return px >= this.x - this.w/2 && px <= this.x + this.w/2 &&
                           py >= this.y - this.h/2 && py <= this.y + this.h/2;
                } else if (this.type === 'circle') {
                    return ((px - this.x)**2 + (py - this.y)**2) <= this.r**2;
                } else if (this.type === 'triangle') {
                    return isPointInTriangle({x: px, y: py}, this.p1, this.p2, this.p3);
                }
                return false;
            }

            getLeftEdge() {
                if (this.type === 'rect') return this.x - this.w/2;
                if (this.type === 'circle') return this.x - this.r;
                if (this.type === 'triangle') return Math.min(this.p1.x, this.p2.x, this.p3.x);
                return this.x;
            }

            getRightEdge() {
                if (this.type === 'rect') return this.x + this.w/2;
                if (this.type === 'circle') return this.x + this.r;
                if (this.type === 'triangle') return Math.max(this.p1.x, this.p2.x, this.p3.x);
                return this.x;
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function showTitleScreen() {
            let html = `<p>マウスカーソルがプレイヤーです。<br>右から流れてくる図形の上だけを通り、真っ暗な穴に落ちないように進め！<br><span style="color: #ff5555; font-size: 14px;">※黒いところに出ても0.2秒間は耐えられます！</span></p>`;
            if (highScore > 0) {
                html += `<div class="highscore-result">🏆 現在のハイスコア: ${highScore} 点</div>`;
            }
            document.getElementById('content').innerHTML = html;
        }

        function generateInitialShapes() {
            shapes = [];
            let startPlatform = new Shape(canvas.width / 2, canvas.height / 2, 'rect');
            startPlatform.w = 400;
            startPlatform.h = 180;
            startPlatform.color = '#333338';
            shapes.push(startPlatform);

            let lastShape = startPlatform;
            while (lastShape.getRightEdge() < canvas.width + 300) {
                lastShape = createNextShape(lastShape);
                shapes.push(lastShape);
            }
        }

        function createNextShape(lastShape) {
            const types = ['rect', 'circle', 'triangle'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            let lastRight = lastShape.getRightEdge();
            let gap = -50 + Math.random() * 40; 
            
            let cy = lastShape.y + (-100 + Math.random() * 200);
            cy = Math.max(150, Math.min(canvas.height - 150, cy));
            
            let nextShape = new Shape(lastRight, cy, type);
            let currentLeft = nextShape.getLeftEdge();
            let targetLeft = lastRight + gap;
            
            nextShape.x += (targetLeft - currentLeft);
            nextShape.updateVertices();
            
            return nextShape;
        }

        window.addEventListener('mousemove', (e) => {
            if (gameState === 'PLAYING') {
                mouseX = e.clientX;
                mouseY = e.clientY;
            }
        });

        document.getElementById('start-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            initGame();
        });

        function initGame() {
            score = 0;
            gameSpeed = 4;
            playerFallScale = 1.0;
            offShapeStartTime = null; // リセット
            generateInitialShapes();
            
            mouseX = canvas.width / 2;
            mouseY = canvas.height / 2;
            
            document.getElementById('ui').style.display = 'none';
            document.getElementById('score-display').style.display = 'block';
            gameState = 'PLAYING';
        }

        function showGameOver() {
            const finalScore = Math.floor(score / 10);
            let isNewRecord = false;

            if (finalScore > highScore) {
                highScore = finalScore;
                localStorage.setItem('shape_runner_highscore', highScore);
                isNewRecord = true;
            }

            document.getElementById('title').innerText = 'GAME OVER';
            
            let resultHtml = `
                <p>真っ暗な奈落に落ちてしまった！</p>
                <div class="score-result">今回のスコア: <b>${finalScore}</b> 点</div>
            `;
            
            if (isNewRecord) {
                resultHtml += `<div class="highscore-result" style="color: #ff00ff; font-size: 20px;">🎉 自己ベスト更新！ 🎉</div>`;
            } else {
                resultHtml += `<div class="highscore-result">🏆 自己ベスト: ${highScore} 点</div>`;
            }

            document.getElementById('content').innerHTML = resultHtml;
            document.getElementById('start-btn').innerText = 'もう一度挑戦';
            document.getElementById('ui').style.display = 'block';
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (gameState === 'PLAYING') {
                gameSpeed += 0.0015;
                score += 1;
                document.getElementById('score-display').innerText = `SCORE: ${Math.floor(score / 10)}`;

                for (let i = shapes.length - 1; i >= 0; i--) {
                    shapes[i].move(gameSpeed);
                    if (shapes[i].getRightEdge() < 0) {
                        shapes.splice(i, 1);
                    }
                }

                let lastShape = shapes[shapes.length - 1];
                if (lastShape.getRightEdge() < canvas.width + 200) {
                    shapes.push(createNextShape(lastShape));
                }

                // 当たり判定
                let onShape = false;
                for (let shape of shapes) {
                    if (shape.contains(mouseX, mouseY)) {
                        onShape = true;
                        break;
                    }
                }

                // 【修正ポイント】図形から外れたときの0.2秒猶予ロジック
                if (onShape) {
                    // 図形の上に乗っていればタイマーをクリア
                    offShapeStartTime = null;
                } else {
                    // 黒いところに外れた場合
                    if (offShapeStartTime === null) {
                        // 外れた瞬間のタイムスタンプを記録
                        offShapeStartTime = Date.now();
                    } else {
                        // 外れ続けて0.2秒（200ms）以上経ったら本当に落下
                        if (Date.now() - offShapeStartTime > gracePeriod) {
                            gameState = 'FALLING';
                            fallX = mouseX;
                            fallY = mouseY;
                            offShapeStartTime = null;
                        }
                    }
                }
            } else if (gameState === 'FALLING') {
                playerFallScale -= 0.04;
                for (let shape of shapes) {
                    shape.move(gameSpeed * 0.5);
                }
                if (playerFallScale <= 0) {
                    gameState = 'GAMEOVER';
                    showGameOver();
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let shape of shapes) {
                shape.draw();
            }

            if (gameState === 'PLAYING') {
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, playerRadius, 0, Math.PI * 2);
                
                // 【修正ポイント】0.2秒の猶予期間中はプレイヤーを赤く光らせて警告
                if (offShapeStartTime !== null) {
                    ctx.fillStyle = '#ff3333';
                    ctx.shadowColor = '#ff3333';
                } else {
                    ctx.fillStyle = '#fff';
                    ctx.shadowColor = '#fff';
                }
                
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
            } else if (gameState === 'FALLING') {
                ctx.beginPath();
                ctx.arc(fallX, fallY, playerRadius * playerFallScale, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${playerFallScale})`;
                ctx.shadowBlur = 15 * playerFallScale;
                ctx.shadowColor = '#fff';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        showTitleScreen();
        generateInitialShapes();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
