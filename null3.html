<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>よく使うサイト一覧</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1f2937, #4b5563);
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-bottom: 100px;
    }
    header {
      margin: 2rem 0 3rem;
      text-align: center;
    }
    header h1 {
      font-size: 3rem;
      letter-spacing: 0.1em;
      animation: fadeInDown 1s ease forwards;
      opacity: 0;
    }
    nav {
      display: flex;
      gap: 2rem;
      margin-top: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    nav a {
      color: #9ca3af;
      text-decoration: none;
      font-weight: 600;
      position: relative;
      padding-bottom: 4px;
      transition: color 0.3s ease;
    }
    nav a::after {
      content: "";
      position: absolute;
      left: 0; bottom: 0;
      width: 100%; height: 2px;
      background: #38bdf8;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.3s ease;
    }
    nav a:hover {
      color: #38bdf8;
    }
    nav a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      width: 90%;
      max-width: 1200px;
    }
    .card {
      display: block;
      background: #374151;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 15px rgba(8, 145, 178, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      color: #e0e7ff;
      text-decoration: none;
    }
    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 30px rgba(56, 189, 248, 0.6);
    }
    .card h2 {
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }
    .card p {
      line-height: 1.5;
      color: #cbd5e1;
    }
    h2.section-title {
      grid-column: 1 / -1;
      margin: 2rem 0 0.5rem;
      font-size: 2rem;
      color: #a5f3fc;
      border-bottom: 2px solid #38bdf8;
      padding-bottom: 0.5rem;
    }
    @keyframes fadeInDown {
      0% {
        opacity: 0;
        transform: translateY(-20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    /* トップに戻るボタン */
    .back-to-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #38bdf8;
      color: white;
      padding: 12px 16px;
      border-radius: 50%;
      font-size: 20px;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: background 0.3s ease;
    }
    .back-to-top:hover {
      background: #0ea5e9;
    }
  </style>
</head>
<body>
  <header id="top">
    <h1>My Site</h1>
    <nav>
      <a href="#entertainment">娯楽</a>
      <a href="#study">学業</a>
      <a href="#presen">リベラル</a>
      <a href="#hobby">趣味</a>
    </nav>
  </header>

  <main>

    <h2 id="entertainment" class="section-title">🎮 娯楽</h2>

    <h2 id="study" class="section-title">📚 学業</h2>

    <h2 id="presen" class="section-title">🦜　リベラル</h2>

    <h2 id="hobby" class="section-title">🧪 趣味</h2>

  </main>

  <!-- トップへ戻るボタン -->
  <a href="#top" class="back-to-top" title="トップへ戻る">↑</a>

</body>
</html>
