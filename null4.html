<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>速度可変！ハイパー観覧車シミュレーター</title>
    <!-- Tailwind CSS for modern responsive UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D graphics rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for dynamic camera control -->

    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
            background-color: #0b0f19;
            color: #ffffff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Responsive layout container for floating UI */
        .sidebar-container {
            width: 320px;
            max-width: calc(100vw - 2rem);
        }

        /* Glassmorphism card styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
        }

        /* Custom hold buttons animation */
        .btn-hold {
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-hold:active {
            transform: scale(0.95);
        }
        .btn-hold::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.2);
            opacity: 0;
            transition: opacity 0.15s;
        }
        .btn-hold:active::after {
            opacity: 1;
        }

        /* Graph Overlay Panel Styling */
        #graphOverlay {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Speed effect visual filter for web camera blur overlay */
        .speed-lines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: radial-gradient(circle, transparent 40%, rgba(255,255,255,0.15) 90%, rgba(0,255,255,0.3) 100%);
        }
    </style>
</head>
<body class="bg-slate-950 text-white overflow-hidden select-none">

    <!-- Speed Effect Overlay -->

                    <div class="flex items-center gap-2 font-black text-sm md:text-base text-cyan-300">
                        <i class="fa-solid fa-backward-step text-sm"></i>
                        <span>減速 / 逆回転</span>

                <!-- Accelerate / Forward Button (HOLD) -->

    <script>
        const CONFIG = {
            wheelRadius: 28,
            wheelCenterY: 34,
            gondolaCount: 16,
            minAlt: 6,
            maxAlt: 62
        };

        let scene, camera, renderer, controls;
        let wheelGroup, gondolaGroupArray = [], gondolaAngleOffsetArray = [];
        let currentSpeed = 0; // km/h
        let wheelAngle = 0; // radians
        let isAcceling = false;
        let isDeceling = false;
        let currentViewMode = 0; // 0: 3rd person, 1: 1st person gondola, 2: graph view
        let altitudeHistory = new Array(120).fill(CONFIG.wheelCenterY);
        let lastTime = performance.now();
        let isAudioOn = false;
        let audioCtx = null, motorOsc = null, motorGain = null;
        let selectedTheme = "サイバーパンクネオン街";
        let isAiSpeaking = false;

        async function callGeminiApi(apiUrl, payload, maxRetries = 3) {
            let delay = 1000;
            for (let attempt = 0; attempt < maxRetries; attempt++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) {
                        return await response.json();
                    }
                } catch (e) {
                    // Retry backoff
                }
                await new Promise(resolve => setTimeout(resolve, delay));
                delay *= 2;
            }
            throw new Error("Gemini API Request failed");
        }

        async function triggerAiPassengerTalk() {
            if (isAiSpeaking) return;
            isAiSpeaking = true;

            const talkBox = document.getElementById('aiTalkOutput');
            const personality = document.getElementById('aiPersonality').value;
            const currentAlt = gondolaGroupArray.length > 0 ? gondolaGroupArray[0].position.y + CONFIG.wheelCenterY : CONFIG.wheelCenterY;
            
            talkBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-purple-400"></i> AI考え中...';

            let promptRole = "怖がりな友達";
            if (personality === "professor") promptRole = "理屈っぽい物理学者の教授";
            else if (personality === "tsundere") promptRole = "ツンデレな同乗ガイド";

            const systemPrompt = `あなたは観覧車に一緒に乗っている「${promptRole}」です。現在の観覧車の高度は ${currentAlt.toFixed(1)}m、速度は ${currentSpeed.toFixed(0)}km/h (マイナスなら逆回転) です。この状況に対するセリフを日本語60文字以内で一言発話してください。語尾やキャラ付けを徹底してください。`;
            
            try {
                const apiKey = "";
                const textUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                const textRes = await callGeminiApi(textUrl, {
                    contents: [{ parts: [{ text: systemPrompt }] }]
                });
                const text = textRes?.candidates?.[0]?.content?.parts?.[0]?.text || "風景がきれいだね！";
                talkBox.textContent = text;
            } catch (e) {
                talkBox.textContent = "「わあ！ここからの景色、最高だね！」";
            } finally {
                isAiSpeaking = false;
            }
        }

        async function triggerAiPhysicsReport() {
            const modal = document.getElementById('aiPhysicsModal');
            const content = document.getElementById('aiPhysicsContent');
            modal.classList.remove('hidden');
            content.innerHTML = '<div class="flex items-center gap-2"><i class="fa-solid fa-spinner fa-spin text-cyan-400"></i> Gemini AIが物理計算中...</div>';

            const absSpeed = Math.abs(currentSpeed);
            const radius = CONFIG.wheelRadius;
            const v = (absSpeed * 1000) / 3600;
            const centripetalAcc = (v * v) / radius;
            const gForce = centripetalAcc / 9.80665;

            const prompt = `観覧車シミュレーターの物理データを解析してください:
- 速度: ${currentSpeed} km/h
- 観覧車半径: ${radius} m
- 算出遠心加速度: ${centripetalAcc.toFixed(2)} m/s^2
- Gフォース: ${gForce.toFixed(2)} G

専門的な物理学者の視点で、乗客の遠心力、人体への影響、SF的な現象評価を楽しく日本語で解説する短文レポート（Markdown形式）を出力してください。`;

            try {
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                const res = await callGeminiApi(apiUrl, {
                    contents: [{ parts: [{ text: prompt }] }]
                });

                const text = res?.candidates?.[0]?.content?.parts?.[0]?.text || "解析を完了できませんでした。";
                content.innerHTML = text.replace(/\n/g, '<br>');
            } catch (e) {
                content.textContent = "AI物理解析エラーが発生しました。";
            }
        }

        async function generateAiSouvenirPhoto() {
            const placeholder = document.getElementById('photoPlaceholder');
            const img = document.getElementById('photoResult');
            const loading = document.getElementById('photoLoading');

            placeholder.classList.add('hidden');
            img.classList.add('hidden');
            loading.classList.remove('hidden');
            loading.classList.add('flex');

            const currentAlt = gondolaGroupArray.length > 0 ? gondolaGroupArray[0].position.y + CONFIG.wheelCenterY : CONFIG.wheelCenterY;

            const prompt = `A colorful high quality 3D digital artwork souvenir postcard photo of a giant futuristic glowing ferris wheel in a theme park. Altitude is ${currentAlt.toFixed(0)} meters, spinning at speed ${currentSpeed} km/h. Theme: ${selectedTheme}. Vibrant lights, high aesthetic details, cinematic atmosphere.`;

            try {
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-image:generateContent?key=${apiKey}`;
                const res = await callGeminiApi(apiUrl, {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseModalities: ['TEXT', 'IMAGE']
                    }
                });

                const base64Data = res?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                if (base64Data) {
                    img.src = `data:image/png;base64,${base64Data}`;
                    img.classList.remove('hidden');
                } else {
                    placeholder.textContent = "画像の生成に失敗しました。";
                    placeholder.classList.remove('hidden');
                }
            } catch (e) {
                placeholder.textContent = "生成エラーが発生しました。";
                placeholder.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
                loading.classList.remove('flex');
            }
        }

        function set3rdPersonCamera() {
            if (!camera || !controls) return;
            controls.target.set(12, CONFIG.wheelCenterY, 0);
            camera.position.set(12, CONFIG.wheelCenterY + 10, 85);
            controls.update();
        }

        function switchViewMode() {
            currentViewMode = (currentViewMode + 1) % 3;
            const viewText = document.getElementById('viewText');
            const viewIcon = document.getElementById('viewIcon');

            if (currentViewMode === 0) {
                set3rdPersonCamera();
                controls.enabled = true;
                viewText.textContent = "視点: 3人称（全体）";
                viewIcon.className = "fa-solid fa-camera";
            } else if (currentViewMode === 1) {
                controls.enabled = false;
                viewText.textContent = "視点: 1人称（ゴンドラ内）";
                viewIcon.className = "fa-solid fa-eye";
            } else if (currentViewMode === 2) {
                controls.enabled = false;
                camera.position.set(12, CONFIG.wheelCenterY, 70);
                camera.lookAt(12, CONFIG.wheelCenterY, 0);
                viewText.textContent = "視点: 高度解析（グラフ）";
                viewIcon.className = "fa-solid fa-chart-line";
            }
        }

        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                motorOsc = audioCtx.createOscillator();
                motorGain = audioCtx.createGain();

                motorOsc.type = 'sawtooth';
                motorOsc.frequency.setValueAtTime(40, audioCtx.currentTime);
                motorGain.gain.setValueAtTime(0, audioCtx.currentTime);

                motorOsc.connect(motorGain);
                motorGain.connect(audioCtx.destination);
                motorOsc.start();
            } catch (e) {
                console.warn("Audio context failed to start", e);
            }
        }

        function updateAudioPitch() {
            if (!audioCtx || !isAudioOn) return;
            const absSpeed = Math.abs(currentSpeed);
            if (absSpeed < 0.1) {
                motorGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
            } else {
                motorGain.gain.setTargetAtTime(0.08, audioCtx.currentTime, 0.1);
                const freq = 40 + Math.min(absSpeed, 5000) * 0.25;
                motorOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.1);
            }
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0b0f19, 0.008);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            set3rdPersonCamera();

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x223344, 1.2);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffeedd, 1.5);
            dirLight.position.set(40, 80, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            // Center Point Light for Neons
            const centerLight = new THREE.PointLight(0x00ffff, 2, 80);
            centerLight.position.set(12, CONFIG.wheelCenterY, 0);
            scene.add(centerLight);

            // Ground Plane
            const groundGeo = new THREE.PlaneGeometry(300, 300);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x070b12, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Ground Grid Lines
            const gridHelper = new THREE.GridHelper(300, 60, 0x00ffff, 0x1e293b);
            gridHelper.position.y = 0.1;
            scene.add(gridHelper);

            // Build Ferris Wheel Assembly
            createFerrisWheel();

            window.addEventListener('resize', onWindowResize);
        }

        function createFerrisWheel() {
            const ferrisRoot = new THREE.Group();
            ferrisRoot.position.set(12, 0, 0);

            // Support Pillars (A-Frame)
            const legMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8, roughness: 0.2 });
            const legGeo = new THREE.CylinderGeometry(0.8, 1.2, CONFIG.wheelCenterY * 1.15);
            
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-10, CONFIG.wheelCenterY / 2, -2);
            leftLeg.rotation.z = -0.28;
            ferrisRoot.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(10, CONFIG.wheelCenterY / 2, -2);
            rightLeg.rotation.z = 0.28;
            ferrisRoot.add(rightLeg);

            // Center Axle Hub
            const hubGeo = new THREE.CylinderGeometry(3, 3, 4, 32);
            const hubMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.9, roughness: 0.1 });
            const hub = new THREE.Mesh(hubGeo, hubMat);
            hub.rotation.x = Math.PI / 2;
            hub.position.set(0, CONFIG.wheelCenterY, 0);
            ferrisRoot.add(hub);

            // Rotating Wheel Group
            wheelGroup = new THREE.Group();
            wheelGroup.position.set(0, CONFIG.wheelCenterY, 0);

            // Outer Rings
            const ringGeo = new THREE.TorusGeometry(CONFIG.wheelRadius, 0.6, 16, 64);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, emissive: 0x0891b2, emissiveIntensity: 0.5 });
            
            const ring1 = new THREE.Mesh(ringGeo, ringMat);
            ring1.position.z = 1.5;
            wheelGroup.add(ring1);

            const ring2 = new THREE.Mesh(ringGeo, ringMat);
            ring2.position.z = -1.5;
            wheelGroup.add(ring2);

            // Spokes & Gondolas
            const gondolaColors = [0xef4444, 0x3b82f6, 0x10b981, 0xf59e0b, 0x8b5cf6, 0xec4899];
            
            for (let i = 0; i < CONFIG.gondolaCount; i++) {
                const angle = (i / CONFIG.gondolaCount) * Math.PI * 2;
                gondolaAngleOffsetArray.push(angle);

                // Spoke Beam
                const spokeGeo = new THREE.CylinderGeometry(0.2, 0.2, CONFIG.wheelRadius * 2);
                const spokeMat = new THREE.MeshStandardMaterial({ color: 0x64748b });
                const spoke = new THREE.Mesh(spokeGeo, spokeMat);
                spoke.rotation.z = angle;
                wheelGroup.add(spoke);

                // Gondola Group Container (Pivot at attachment point)
                const gGroup = new THREE.Group();
                const gx = Math.cos(angle) * CONFIG.wheelRadius;
                const gy = Math.sin(angle) * CONFIG.wheelRadius;
                gGroup.position.set(gx, gy, 0);

                // Cabin Box Mesh
                const cabGeo = new THREE.BoxGeometry(3.2, 3.6, 2.8);
                const isFirst = (i === 0);
                const cabColor = isFirst ? 0xff1144 : gondolaColors[i % gondolaColors.length];
                const cabMat = new THREE.MeshStandardMaterial({
                    color: cabColor,
                    metalness: 0.3,
                    roughness: 0.3,
                    emissive: cabColor,
                    emissiveIntensity: isFirst ? 0.6 : 0.2
                });
                const cabin = new THREE.Mesh(cabGeo, cabMat);
                cabin.position.y = -1.8;
                gGroup.add(cabin);

                // Gondola #1 Badge
                if (isFirst) {
                    const tagGeo = new THREE.SphereGeometry(0.8, 16, 16);
                    const tagMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                    const tag = new THREE.Mesh(tagGeo, tagMat);
                    tag.position.set(0, 1.2, 0);
                    gGroup.add(tag);
                }

                wheelGroup.add(gGroup);
                gondolaGroupArray.push(gGroup);
            }

            ferrisRoot.add(wheelGroup);
            scene.add(ferrisRoot);
        }

        function drawGauge() {
            const canvas = document.getElementById('gaugeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h - 15;
            const radius = 80;

            ctx.clearRect(0, 0, w, h);

            // Background Arc
            ctx.beginPath();
            ctx.arc(cx, cy, radius, Math.PI, 2 * Math.PI, false);
            ctx.lineWidth = 14;
            ctx.strokeStyle = '#1e293b';
            ctx.stroke();

            // Dynamic Value Fill Arc
            const absSpd = Math.abs(currentSpeed);
            const ratio = Math.min(absSpd / 1000, 1); // Normalized gauge sweep
            const fillAngle = Math.PI + ratio * Math.PI;

            ctx.beginPath();
            ctx.arc(cx, cy, radius, Math.PI, fillAngle, false);
            ctx.lineWidth = 14;
            ctx.strokeStyle = currentSpeed < 0 ? '#06b6d4' : (absSpd > 1000 ? '#f59e0b' : '#10b981');
            ctx.stroke();

            // Needle
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(fillAngle - Math.PI / 2);
            ctx.beginPath();
            ctx.moveTo(-3, 0);
            ctx.lineTo(0, -radius + 8);
            ctx.lineTo(3, 0);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.restore();

            // Update Text Displays
            document.getElementById('speedValue').textContent = currentSpeed.toFixed(1);
            
            const badge = document.getElementById('statusBadge');
            if (Math.abs(currentSpeed) < 0.1) {
                badge.textContent = "停止中 (STOPPED)";
                badge.className = "mt-0.5 px-2.5 py-0.5 rounded-full text-[9px] md:text-[10px] font-bold tracking-wider uppercase bg-slate-800/90 text-slate-300 border border-slate-600/50";
            } else if (currentSpeed > 0) {
                badge.textContent = currentSpeed > 1000 ? "超光速 (HYPER DRIVE)" : "正回転 (FORWARD)";
                badge.className = "mt-0.5 px-2.5 py-0.5 rounded-full text-[9px] md:text-[10px] font-bold tracking-wider uppercase bg-amber-900/80 text-amber-300 border border-amber-500/50";
            } else {
                badge.textContent = "逆回転 (REVERSE)";
                badge.className = "mt-0.5 px-2.5 py-0.5 rounded-full text-[9px] md:text-[10px] font-bold tracking-wider uppercase bg-cyan-900/80 text-cyan-300 border border-cyan-500/50";
            }

            document.getElementById('dirValue').textContent = currentSpeed >= 0 ? "正回転 (+)" : "逆回転 (-)";
        }

        function drawAltitudeGraph() {
            const canvas = document.getElementById('altitudeGraphCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width = canvas.parentElement.clientWidth;
            const h = canvas.height = canvas.parentElement.clientHeight;

            ctx.clearRect(0, 0, w, h);

            // Grid lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
            ctx.moveTo(0, h / 4); ctx.lineTo(w, h / 4);
            ctx.moveTo(0, (3 * h) / 4); ctx.lineTo(w, (3 * h) / 4);
            ctx.stroke();

            // Line Plot
            ctx.strokeStyle = '#06b6d4';
            ctx.lineWidth = 2;
            ctx.beginPath();

            const step = w / (altitudeHistory.length - 1);
            for (let i = 0; i < altitudeHistory.length; i++) {
                const alt = altitudeHistory[i];
                // Map altitude (6m to 62m) to Y canvas coordinates
                const norm = (alt - CONFIG.minAlt) / (CONFIG.maxAlt - CONFIG.minAlt);
                const y = h - (norm * (h - 12) + 6);
                const x = i * step;

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Frequency Display Calculation
            const absSpeed = Math.abs(currentSpeed);
            const circumference = 2 * Math.PI * CONFIG.wheelRadius;
            const vMps = (absSpeed * 1000) / 3600;
            const hz = vMps / circumference;
            document.getElementById('graphFreq').textContent = `${hz.toFixed(2)} Hz`;
        }

        function updateSpeed(dt) {
            if (isAcceling) {
                const absSpd = Math.abs(currentSpeed);
                const rate = 15 + absSpd * 0.8;
                currentSpeed = Math.min(100000, currentSpeed + rate * dt);
            }
            if (isDeceling) {
                const absSpd = Math.abs(currentSpeed);
                const rate = 15 + absSpd * 0.8;
                currentSpeed = Math.max(-100000, currentSpeed - rate * dt);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            updateSpeed(dt);
            updateAudioPitch();

            // Angular velocity calculation (rad/s)
            const speedMps = (currentSpeed * 1000) / 3600;
            const angularVelocity = speedMps / CONFIG.wheelRadius;
            wheelAngle += angularVelocity * dt;

            // Rotate main wheel structure
            if (wheelGroup) {
                wheelGroup.rotation.z = wheelAngle;

                // Keep gondolas hanging upright (counter-rotate)
                gondolaGroupArray.forEach((gondola) => {
                    gondola.rotation.z = -wheelAngle;
                });
            }

            // Track Gondola #1 altitude
            if (gondolaGroupArray.length > 0) {
                const g1Alt = Math.sin(wheelAngle + gondolaAngleOffsetArray[0]) * CONFIG.wheelRadius + CONFIG.wheelCenterY;
                document.getElementById('altValue').textContent = `${g1Alt.toFixed(1)} m`;

                altitudeHistory.push(g1Alt);
                if (altitudeHistory.length > 120) altitudeHistory.shift();
            }

            // Camera Update for Mode 1 (1st Person Gondola #1)
            if (currentViewMode === 1 && gondolaGroupArray.length > 0) {
                const g1 = gondolaGroupArray[0];
                const worldPos = new THREE.Vector3();
                g1.getWorldPosition(worldPos);

                camera.position.set(worldPos.x, worldPos.y - 0.5, worldPos.z + 0.2);
                camera.lookAt(worldPos.x + 10, worldPos.y, worldPos.z);
            } else if (currentViewMode === 0 && controls) {
                controls.update();
            }

            // Speed Lines Visual Overlay Effect
            const speedOverlay = document.getElementById('speedLines');
            if (Math.abs(currentSpeed) > 300) {
                speedOverlay.style.opacity = Math.min(Math.abs(currentSpeed) / 2000, 0.8);
            } else {
                speedOverlay.style.opacity = 0;
            }

            drawGauge();
            drawAltitudeGraph();

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupEventListeners() {
            const btnAccel = document.getElementById('btnAccel');
            const btnDecel = document.getElementById('btnDecel');

            // Accel Hold Events
            const startAccel = (e) => { e.preventDefault(); isAcceling = true; initAudio(); };
            const stopAccel = () => { isAcceling = false; };

            btnAccel.addEventListener('pointerdown', startAccel);
            btnAccel.addEventListener('pointerup', stopAccel);
            btnAccel.addEventListener('pointerleave', stopAccel);

            // Decel Hold Events
            const startDecel = (e) => { e.preventDefault(); isDeceling = true; initAudio(); };
            const stopDecel = () => { isDeceling = false; };

            btnDecel.addEventListener('pointerdown', startDecel);
            btnDecel.addEventListener('pointerup', stopDecel);
            btnDecel.addEventListener('pointerleave', stopDecel);

            // Preset Buttons
            document.getElementById('btnReset').addEventListener('click', () => { currentSpeed = 0; });
            document.getElementById('btnPresetNormal').addEventListener('click', () => { currentSpeed = 15; });
            document.getElementById('btnPresetReverse').addEventListener('click', () => { currentSpeed = -500; });
            document.getElementById('btnPresetHyper').addEventListener('click', () => { currentSpeed = 50000; });

            // View & Audio Toggles
            document.getElementById('viewText').parentElement.addEventListener('click', switchViewMode);
            
            document.getElementById('btnAudioToggle').addEventListener('click', () => {
                initAudio();
                isAudioOn = !isAudioOn;
                document.getElementById('audioText').textContent = isAudioOn ? "サウンド ON" : "サウンド OFF";
                document.getElementById('audioIcon').className = isAudioOn ? "fa-solid fa-volume-high text-cyan-400" : "fa-solid fa-volume-xmark text-slate-400";
            });

            // AI Passengers & Dialog Modals
            document.getElementById('btnAiSpeak').addEventListener('click', triggerAiPassengerTalk);
            document.getElementById('btnAiPhysicsReport').addEventListener('click', triggerAiPhysicsReport);
            document.getElementById('btnClosePhysicsModal').addEventListener('click', () => {
                document.getElementById('aiPhysicsModal').classList.add('hidden');
            });

            document.getElementById('btnAiPhotoModal').addEventListener('click', () => {
                document.getElementById('aiPhotoModal').classList.remove('hidden');
            });
            document.getElementById('btnClosePhotoModal').addEventListener('click', () => {
                document.getElementById('aiPhotoModal').classList.add('hidden');
            });

            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.theme-btn').forEach(b => {
                        b.classList.remove('active', 'bg-amber-600/40', 'border-amber-400', 'text-amber-200');
                        b.classList.add('bg-slate-800', 'border-slate-700', 'text-slate-300');
                    });
                    btn.classList.add('active', 'bg-amber-600/40', 'border-amber-400', 'text-amber-200');
                    btn.classList.remove('bg-slate-800', 'border-slate-700', 'text-slate-300');
                    selectedTheme = btn.getAttribute('data-theme');
                });
            });

            document.getElementById('btnGeneratePhoto').addEventListener('click', generateAiSouvenirPhoto);
        }

        // Initialize Application on Window Load
        window.onload = function () {
            init3D();
            setupEventListeners();
            animate();
        };
    </script>
</body>
</html>
