<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アルミ缶の上にあるみかん - THE AIM</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
            cursor: crosshair;
        }
        canvas {
            display: block;
            background-color: #fff;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #444;
            background: rgba(255,255,255,0.7);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
        .msg {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 52px;
            font-weight: bold;
            color: #ff5500;
            text-shadow: 3px 3px 0 #fff;
            white-space: nowrap;
            display: none;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui">
        <b>マウス移動</b>: 狙う | <b>SPACEキー</b>: 放す<br>
        <small>※失敗したら画面をクリックしてリロードしてください</small>
    </div>
    <div id="success-msg" class="msg">アルミ缶の上にあるみかん</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const successMsg = document.getElementById('success-msg');

// ゲーム状態
let mikanX = 400;
let mikanY = 100;
let isDropping = false;
let isLanded = false;
let isGameOver = false;
let mood = 1.0; 
let showWind = false;
let windParticles = [];
const canX = 400;
const canY = 500;
const canWidth = 80;
const canHeight = 120;

// 人だかり
let people = [];
for (let i = 0; i < 40; i++) {
    people.push({
        x: Math.random() * 800,
        y: 520 + Math.random() * 60,
        vx: (Math.random() - 0.5) * 0.8,
        color: `hsl(${Math.random() * 30 + 15}, 80%, 60%)`,
        size: 18 + Math.random() * 12,
        isLeaving: false
    });
}

function draw() {
    // 1. 背景（温かいオレンジ or 冷たいブルー）
    const r = Math.floor(255 * mood + 80 * (1 - mood));
    const g = Math.floor(200 * mood + 100 * (1 - mood));
    const b = Math.floor(150 * mood + 160 * (1 - mood));
    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 2. 地面
    ctx.fillStyle = mood > 0.5 ? "#d9b38c" : "#8c9fb3";
    ctx.fillRect(0, 550, canvas.width, 50);

    // 3. 人だかり
    people.forEach(p => {
        if (p.isLeaving) p.x += p.vx * 15;
        ctx.fillStyle = p.color;
        if (mood < 0.6) ctx.globalAlpha = Math.max(0, mood + 0.2);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    // 4. アルミ缶 (平行視点)
    const canTopY = canY - canHeight;
    ctx.fillStyle = "#aaa";
    ctx.fillRect(canX - canWidth/2, canTopY, canWidth, canHeight);
    // 缶のハイライト
    ctx.fillStyle = "#ccc";
    ctx.fillRect(canX - canWidth/2 + 5, canTopY, 15, canHeight);
    ctx.strokeStyle = "#777";
    ctx.strokeRect(canX - canWidth/2, canTopY, canWidth, canHeight);

    // 5. みかん
    if (!isGameOver || isLanded) {
        ctx.fillStyle = "#ff9900";
        ctx.beginPath();
        ctx.arc(mikanX, mikanY, 22, 0, Math.PI * 2);
        ctx.fill();
        // ヘタ
        ctx.fillStyle = "#2d5a27";
        ctx.fillRect(mikanX - 3, mikanY - 25, 6, 6);
    }

    // 6. 風のエフェクト
    if (showWind) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
        ctx.lineWidth = 1;
        windParticles.forEach(w => {
            ctx.beginPath();
            ctx.moveTo(w.x, w.y);
            ctx.lineTo(w.x + 60, w.y);
            ctx.stroke();
            w.x += 20;
        });
        if (Math.random() > 0.4) windParticles.push({x: -100, y: Math.random() * 600});
        if (windParticles.length > 20) windParticles.shift();
    }

    update();
    requestAnimationFrame(draw);
}

function update() {
    if (isDropping && !isLanded) {
        mikanY += 8; // 自由落下

        // 着地判定（缶の上面）
        const canTopY = canY - canHeight;
        if (mikanY >= canTopY - 20) {
            // 缶の幅の中にいれば成功
            if (mikanX > canX - canWidth/2 && mikanX < canX + canWidth/2) {
                mikanY = canTopY - 20;
                isLanded = true;
                triggerSuccess();
            } else if (mikanY > canvas.height + 50) {
                // 画面外に落ちたら失敗
                isDropping = false;
                isGameOver = true;
            }
        }
    }

    // 演出進行
    if (isLanded && mood > 0 && people[0].isLeaving) {
        mood -= 0.005;
        if (mood < 0) mood = 0;
    }
}

function triggerSuccess() {
    successMsg.style.display = 'block';
    
    // 1秒後に風が吹く
    setTimeout(() => {
        showWind = true;
    }, 1000);

    // 3秒後に人々が去り、背景が冷たくなる
    setTimeout(() => {
        people.forEach(p => {
            p.isLeaving = true;
            p.vx = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 2 + 1);
        });
    }, 3000);
}

// 操作
window.addEventListener('mousemove', (e) => {
    if (!isDropping && !isLanded) {
        const rect = canvas.getBoundingClientRect();
        mikanX = e.clientX - rect.left;
    }
});

window.addEventListener('keydown', (e) => {
    if (e.key === ' ' && !isDropping) {
        isDropping = true;
    }
});

// リトライ用
canvas.addEventListener('click', () => {
    if (isGameOver || isLanded) location.reload();
});

draw();
</script>
</body>
</html>
