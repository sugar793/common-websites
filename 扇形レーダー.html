<!DOCTYPE html>
<html lang="ja">
<head>
   <meta charset="UTF-8">
   <title>超音波センサー レーダー＆ヒストグラム可視化ツール (m対応版)</title>
   <style>
       body {
           background-color: #0b0f19;
           color: #00ff66;
           font-family: 'Courier New', Courier, monospace, "Helvetica Neue", Arial, sans-serif;
           display: flex;
           flex-direction: column;
           align-items: center;
           padding: 20px;
           margin: 0;
       }
       h1 {
           margin-bottom: 20px;
           text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
           font-size: 24px;
           letter-spacing: 2px;
       }
       .container {
           display: flex;
           gap: 25px;
           width: 100%;
           max-width: 1200px;
           flex-wrap: wrap;
       }
       .control-panel {
           flex: 1;
           min-width: 300px;
           background: #111827;
           padding: 20px;
           border-radius: 12px;
           border: 1px solid #00ff66;
           box-shadow: 0 0 15px rgba(0, 255, 102, 0.1);
       }
       .display-panel {
           flex: 2;
           min-width: 500px;
           display: flex;
           flex-direction: column;
           align-items: center;
           background: #000;
           padding: 15px;
           border-radius: 12px;
           border: 1px solid #00ff66;
           box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
       }
       h3 {
           margin-top: 0;
           color: #fff;
           border-bottom: 1px solid #334155;
           padding-bottom: 8px;
       }
       textarea {
           width: 100%;
           height: 200px;
           background: #030712;
           color: #38bdf8;
           border: 1px solid #334155;
           border-radius: 6px;
           padding: 10px;
           box-sizing: border-box;
           font-family: monospace;
           font-size: 13px;
           resize: vertical;
       }
       textarea:focus {
           outline: none;
           border-color: #00ff66;
       }
       button {
           background: #00ff66;
           color: #000;
           border: none;
           padding: 12px 20px;
           font-size: 16px;
           font-weight: bold;
           cursor: pointer;
           margin-top: 15px;
           width: 100%;
           border-radius: 6px;
           transition: all 0.2s;
       }
       button:hover {
           background: #33ff88;
           box-shadow: 0 0 15px rgba(0,255,102,0.6);
           transform: translateY(-1px);
       }
       canvas {
           background: #020617;
           width: 100%;
           max-width: 700px;
           height: auto;
       }
       .label {
           margin-top: 12px;
           font-weight: bold;
           color: #94a3b8;
           font-size: 14px;
       }
       select, input {
           background: #030712;
           color: #00ff66;
           border: 1px solid #334155;
           padding: 8px;
           margin-top: 5px;
           width: 100%;
           box-sizing: border-box;
           border-radius: 6px;
       }
       select:focus, input:focus {
           outline: none;
           border-color: #00ff66;
       }
       .info {
           font-size: 12px;
           color: #64748b;
           margin-bottom: 10px;
           line-height: 1.4;
       }
   </style>
</head>
<body>

<h1>ULTRASONIC DATA VISUALIZER (m版)</h1>

<div class="container">
   <div class="control-panel">
       <h3>1. データの貼り付け</h3>
       <p class="info">
           スプレッドシートの<b>「位置」と「距離(m)」の2つの列</b>をドラッグしてコピーし、そのまま下の枠内に貼り付けてください。
       </p>
       <textarea id="dataInput" placeholder="例：&#10;1  0.22&#10;2  0.18&#10;3  0.12&#10;..."></textarea>
      
       <h3>2. グラフ設定</h3>
       <div class="label">グラフの種類:</div>
       <select id="chartType">
           <option value="radar">扇形レーダー（極座標）</option>
           <option value="histogram">ヒストグラム / 棒グラフ（直交座標）</option>
       </select>

       <div class="label">角度のマッピング方法 (レーダー用):</div>
       <select id="angleMode">
           <option value="scale">データの「最小位置〜最大位置」を「0度〜180度」の扇形に広げる</option>
           <option value="direct">「位置」の数値をそのまま「角度（度）」として扱う</option>
           <option value="scale360">「最小位置〜最大位置」を「0度〜360度（全円）」に広げる</option>
       </select>

       <div class="label">最大表示距離 (m):</div>
       <!-- 最大値をm用に調整（初期値3.0m、0.1m刻み） -->
       <input type="number" id="maxDistanceInput" value="3.0" step="0.1" min="0.1" max="50">
      
       <button id="drawBtn">グラフを描画する</button>
   </div>
  
   <div class="display-panel">
       <canvas id="radarCanvas" width="700" height="450"></canvas>
   </div>
</div>

<script>
const canvas = document.getElementById('radarCanvas');
const ctx = canvas.getContext('2d');
const dataInput = document.getElementById('dataInput');
const chartType = document.getElementById('chartType');
const angleMode = document.getElementById('angleMode');
const maxDistanceInput = document.getElementById('maxDistanceInput');
const drawBtn = document.getElementById('drawBtn');

// 初期状態のサンプルデータ
dataInput.value = ``;

// --- 扇形レーダーの描画 ---
function drawRadar(points, maxDist, mode) {
   ctx.clearRect(0, 0, canvas.width, canvas.height);
  
   const is360 = (mode === 'scale360');
   let cx = canvas.width / 2;
   // 修正: 計算記号の補完
   let cy = is360 ? canvas.height / 2 : canvas.height - 50;
   let maxRadius = is360 ? Math.min(canvas.width, canvas.height) / 2 - 40 : canvas.height - 90;
  
   // 背景の目盛り
   ctx.strokeStyle = 'rgba(0, 255, 102, 0.15)';
   ctx.fillStyle = 'rgba(0, 255, 102, 0.6)';
   ctx.font = '11px monospace';
   ctx.lineWidth = 1;
  
   const circles = 4;
   for(let i = 1; i <= circles; i++) {
       let r = (maxRadius / circles) * i;
       let d = (maxDist / circles) * i;
      
       ctx.beginPath();
       if (is360) {
           ctx.arc(cx, cy, r, 0, Math.PI * 2);
       } else {
           ctx.arc(cx, cy, r, Math.PI, 0);
       }
       ctx.stroke();
      
       ctx.textAlign = 'left';
       // 修正: cm -> m, 桁数を小数点以下2桁(m精度)に変更, 計算記号の補完
       ctx.fillText(`${d.toFixed(2)}m`, cx + r * Math.cos(45 * Math.PI / 180), cy - r * Math.sin(45 * Math.PI / 180));
   }
  
   const step = is360 ? 30 : 15;
   for(let a = 0; a <= (is360 ? 360 : 180); a += step) {
       let rad = a * Math.PI / 180;
       let x = cx + maxRadius * Math.cos(rad);
       let y = cy - maxRadius * Math.sin(rad);
      
       ctx.beginPath();
       ctx.moveTo(cx, cy);
       ctx.lineTo(x, y);
       ctx.strokeStyle = 'rgba(0, 255, 102, 0.1)';
       ctx.stroke();
      
       let lx = cx + (maxRadius + 18) * Math.cos(rad);
       let ly = cy - (maxRadius + 18) * Math.sin(rad);
       ctx.textAlign = 'center';
       ctx.textBaseline = 'middle';
       ctx.fillText(`${a}°`, lx, ly);
   }

   if (points.length === 0) return;
  
   let minP = Math.min(...points.map(p => p.pos));
   let maxP = Math.max(...points.map(p => p.pos));
   if (minP === maxP) maxP = minP + 1;
  
   let processedPoints = points.map(p => {
       let angle_deg = 0;
       if (mode === 'scale') {
           angle_deg = ((p.pos - minP) / (maxP - minP)) * 180;
       } else if (mode === 'scale360') {
           angle_deg = ((p.pos - minP) / (maxP - minP)) * 360;
       } else {
           angle_deg = p.pos;
       }
      
       let rad = angle_deg * Math.PI / 180;
       let r = (p.dist / maxDist) * maxRadius;
       if (r > maxRadius) r = maxRadius;
       if (r < 0) r = 0;
      
       return {
           x: cx + r * Math.cos(rad),
           y: cy - r * Math.sin(rad)
       };
   });

   // 中心から各点への線
   ctx.strokeStyle = 'rgba(0, 255, 102, 0.3)';
   ctx.lineWidth = 1;
   processedPoints.forEach(p => {
       ctx.beginPath();
       ctx.moveTo(cx, cy);
       ctx.lineTo(p.x, p.y);
       ctx.stroke();
   });
  
   // 輪郭線
   ctx.beginPath();
   ctx.moveTo(processedPoints[0].x, processedPoints[0].y);
   for(let i = 1; i < processedPoints.length; i++) {
       ctx.lineTo(processedPoints[i].x, processedPoints[i].y);
   }
   ctx.strokeStyle = '#00ff66';
   ctx.lineWidth = 2.5;
   ctx.shadowBlur = 8;
   ctx.shadowColor = '#00ff66';
   ctx.stroke();
   ctx.shadowBlur = 0;
  
   // 点
   ctx.fillStyle = '#ffffff';
   processedPoints.forEach(p => {
       ctx.beginPath();
       ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
       ctx.fill();
   });
  
   // センサー位置（中心点）
   ctx.fillStyle = '#ff3366';
   ctx.beginPath();
   ctx.arc(cx, cy, 6, 0, Math.PI * 2);
   ctx.fill();
}

// --- ヒストグラム（棒グラフ）の描画 ---
function drawHistogram(points, maxDist) {
   ctx.clearRect(0, 0, canvas.width, canvas.height);

   const margin = { top: 40, right: 30, bottom: 60, left: 60 };
   const chartWidth = canvas.width - margin.left - margin.right;
   const chartHeight = canvas.height - margin.top - margin.bottom;

   // 背景グリッドと目盛り (Y軸: 距離)
   ctx.strokeStyle = 'rgba(0, 255, 102, 0.15)';
   ctx.fillStyle = 'rgba(0, 255, 102, 0.6)';
   ctx.font = '11px monospace';
   ctx.lineWidth = 1;

   const ySteps = 5;
   for (let i = 0; i <= ySteps; i++) {
       const y = margin.top + chartHeight - (chartHeight / ySteps) * i;
       const distVal = (maxDist / ySteps) * i;

       ctx.beginPath();
       ctx.moveTo(margin.left, y);
       ctx.lineTo(margin.left + chartWidth, y);
       ctx.stroke();

       ctx.textAlign = 'right';
       ctx.textBaseline = 'middle';
       // 修正: cm -> m, 桁数を小数点以下2桁(m精度)に変更
       ctx.fillText(`${distVal.toFixed(2)}m`, margin.left - 10, y);
   }

   // 軸線
   ctx.strokeStyle = '#00ff66';
   ctx.lineWidth = 1.5;
   ctx.beginPath();
   ctx.moveTo(margin.left, margin.top);
   ctx.lineTo(margin.left, margin.top + chartHeight);
   ctx.lineTo(margin.left + chartWidth, margin.top + chartHeight);
   ctx.stroke();

   // 軸タイトル
   ctx.fillStyle = '#00ff66';
   ctx.textAlign = 'center';
   ctx.fillText('位置 (ステップ / 角度)', margin.left + chartWidth / 2, canvas.height - 15);

   if (points.length === 0) return;

   // 棒（バー）の描画
   const barGap = 2;
   const slotWidth = chartWidth / points.length;
   const barWidth = Math.max(1, slotWidth - barGap);

   points.forEach((p, i) => {
       let dist = p.dist;
       if (dist > maxDist) dist = maxDist;
       if (dist < 0) dist = 0;

       const barHeight = (dist / maxDist) * chartHeight;
       const x = margin.left + i * slotWidth + barGap / 2;
       const y = margin.top + chartHeight - barHeight;

       // 棒のグラデーション塗りつぶし
       const grad = ctx.createLinearGradient(0, margin.top + chartHeight, 0, margin.top);
       grad.addColorStop(0, 'rgba(0, 255, 102, 0.1)');
       grad.addColorStop(1, 'rgba(0, 255, 102, 0.6)');

       ctx.fillStyle = grad;
       ctx.fillRect(x, y, barWidth, barHeight);

       ctx.strokeStyle = '#00ff66';
       ctx.lineWidth = 1;
       ctx.strokeRect(x, y, barWidth, barHeight);

       // X軸目盛り
       const labelInterval = Math.ceil(points.length / 12);
       if (i % labelInterval === 0 || i === points.length - 1) {
           ctx.fillStyle = '#94a3b8';
           ctx.textAlign = 'center';
           ctx.textBaseline = 'top';
           ctx.fillText(p.pos, x + barWidth / 2, margin.top + chartHeight + 8);
       }
   });
}

function processDataAndDraw() {
   const text = dataInput.value;
   const mode = angleMode.value;
   const maxDist = parseFloat(maxDistanceInput.value) || 3.0; // デフォルトを3.0mに
   const type = chartType.value;
  
   const lines = text.split('\n');
   const points = [];
  
   lines.forEach(line => {
       const tokens = line.trim().split(/[\t, ]+/);
       if (tokens.length >= 2) {
           const pos = parseFloat(tokens[tokens.length - 2]);
           const dist = parseFloat(tokens[tokens.length - 1]);
          
           if (!isNaN(pos) && !isNaN(dist)) {
               points.push({ pos, dist });
           }
       }
   });
  
   points.sort((a, b) => a.pos - b.pos);
  
   if (type === 'histogram') {
       drawHistogram(points, maxDist);
   } else {
       drawRadar(points, maxDist, mode);
   }
}

drawBtn.addEventListener('click', processDataAndDraw);
chartType.addEventListener('change', processDataAndDraw);

processDataAndDraw();
</script>
</body>
</html>
